<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com https://apis.google.com https://unpkg.com;
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data: https://tiles.basemaps.cartocdn.com;
    connect-src 'self' https://www.gstatic.com https://apis.google.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api-adresse.data.gouv.fr https://photon.komoot.io https://nominatim.openstreetmap.org https://basemaps.cartocdn.com https://tiles.basemaps.cartocdn.com https://unpkg.com;
    worker-src 'self' blob:;
    frame-src https://*.firebaseapp.com https://accounts.google.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Preview DA — Navy + glass · Our Space</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
  <link rel="icon" href="assets/icons/favicon.png" type="image/png" sizes="283x283" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="modulepreload" href="https://unpkg.com/three@0.170.0/build/three.module.js" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/love-hearts.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/home.css" />
  <link rel="stylesheet" href="assets/css/activities.css" />
  <link rel="stylesheet" href="assets/css/item-author.css" />
  <link rel="stylesheet" href="assets/css/bottom-nav.css" />
  <link rel="stylesheet" href="assets/css/maplibre-gl.css" />
  <link rel="stylesheet" href="assets/css/map.css" />
  <link rel="stylesheet" href="assets/css/add-item.css" />
  <link rel="stylesheet" href="assets/css/settings.css" />
  <link rel="stylesheet" href="assets/css/app-glass-theme.css" />
  <link rel="stylesheet" href="assets/css/test-preview.css" />
</head>
<body class="test-preview-page auth-page">
  <svg class="page-bg-grain-def" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <filter
        id="page-bg-grain-filter"
        x="0"
        y="0"
        width="100%"
        height="100%"
        filterUnits="objectBoundingBox"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.72"
          numOctaves="4"
          stitchTiles="stitch"
          result="noise"
        />
        <feColorMatrix
          in="noise"
          type="matrix"
          values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0"
        />
      </filter>
    </defs>
  </svg>

  <div class="page-bg" aria-hidden="true">
    <canvas id="page-bg-canvas"></canvas>
    <div class="page-bg-grain" aria-hidden="true"></div>
  </div>

  <div id="auth-view">
    <div class="auth-container">
      <div class="auth-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        </svg>
      </div>

      <header class="auth-header">
        <p>Preview DA — connectez-vous pour charger vos données</p>
      </header>

      <form id="login-form" class="auth-form" novalidate>
        <div class="input-group">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            placeholder="Adresse email"
            aria-label="Adresse email"
            value="bastosjamet@gmail.com"
          >
        </div>

        <div class="input-group">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="Mot de passe"
            aria-label="Mot de passe"
          >
        </div>

        <p id="error-message" class="error hidden" role="alert"></p>

        <button type="submit" id="submit-btn" class="btn-primary">
          Se connecter
        </button>
      </form>
    </div>
  </div>

  <div id="app-view" class="hidden">
    <div id="page-header-root"></div>
    <div id="page-root" class="app-main"></div>
    <div id="bottom-nav-root"></div>
  </div>

  <script src="assets/js/vendor/maplibre-gl.js"></script>
  <script type="module" src="assets/js/page-bg-gradient.js"></script>
  <script type="module" src="assets/js/test-page-preview.js"></script>
</body>
</html>
